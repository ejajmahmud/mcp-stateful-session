[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-stateful-session"
version = "0.1.0"
description = "Session persistence and resumption store with snapshot rollbacks for MCP conversations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-stateful-session = "mcp_stateful_session.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_stateful_session*"]
